<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>ADO Master</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header class="side-head">
      <h1>Iterations</h1>
      <div class="side-actions">
        <button id="sync" class="btn-ghost" title="執行 get_iterations.py 重新同步">↻ 同步</button>
        <button id="side-toggle" class="btn-icon" title="收合側欄 (Ctrl+B)" aria-expanded="true" aria-controls="sidebar">«</button>
      </div>
    </header>
    <button id="browse" class="btn-ghost btn-browse" title="從全部 Iteration 中選擇">☰ 選擇 Iteration…</button>
    <div id="pinned"></div>
    <p id="tree-status" class="muted"></p>
  </aside>

  <dialog id="iter-dialog">
    <div class="dlg-box">
      <header class="dlg-head">
        <h3>選擇 Iteration</h3>
        <button id="dlg-close" class="btn-icon" title="關閉 (Esc)">✕</button>
      </header>
      <input id="filter" type="search" placeholder="篩選 Iteration 名稱或路徑…" />
      <div id="tree" role="tree"></div>
      <p class="muted dlg-hint">點選 Iteration 切換顯示；按 ☆ 固定到左側清單</p>
    </div>
  </dialog>

  <dialog id="understand-dialog">
    <form id="und-form" class="dlg-box" method="dialog">
      <header class="dlg-head">
        <h3>Manager understand</h3>
        <button type="button" id="und-close" class="btn-icon" title="關閉 (Esc)">✕</button>
      </header>
      <div class="und-body">
        <p id="und-req" class="und-req"></p>
        <p class="muted">勾選此需求需要開發的 repository，並選擇要做在哪個 feature branch。</p>
        <div id="und-repos" class="und-repos"></div>
        <p id="und-error" class="status error" hidden></p>
      </div>
      <footer class="dlg-foot">
        <button type="button" id="und-clear" class="btn-ghost btn-danger">取消確認</button>
        <span class="spacer"></span>
        <button type="button" id="und-cancel" class="btn-ghost">取消</button>
        <button type="submit" id="und-ok" class="btn-primary">確認</button>
      </footer>
    </form>
  </dialog>

  <main id="content">
    <header class="content-head">
      <div>
        <h2 id="wi-title">請從左側選擇 Iteration</h2>
        <p id="wi-sub" class="muted"></p>
      </div>
      <div class="head-actions">
        <nav class="tabs" role="tablist">
          <button class="tab active" data-view="flow" role="tab">Requirement 流程</button>
          <button class="tab" data-view="items" role="tab">Work Items</button>
        </nav>
        <label class="check"><input id="exact" type="checkbox" /> 不含子 Iteration</label>
      </div>
    </header>

    <section id="view-flow" class="view">
      <div id="flow-status" class="status"></div>
      <div id="flow-summary" class="summary"></div>
      <div class="table-wrap">
        <table id="flow-table" class="flow" hidden>
          <thead>
            <tr>
              <th class="req-col">Requirement</th>
              <th data-stage="pending">Pending</th>
              <th data-stage="implement">Implement</th>
              <th data-stage="testDeploy">Test deploy</th>
              <th data-stage="test">Test</th>
              <th data-stage="prodDeploy">Prod deploy</th>
              <th data-stage="recap">Release recap</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="view-items" class="view" hidden>
      <div id="wi-status" class="status"></div>
      <div id="wi-summary" class="summary"></div>
      <div class="table-wrap">
        <table id="wi-table" hidden>
          <thead>
            <tr>
              <th>ID</th><th>類型</th><th>標題</th><th>狀態</th><th>指派給</th>
              <th>Iteration</th><th class="num">剩餘</th><th class="num">完成</th><th>最後修改</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
