<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>ADO Master</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header class="side-head">
      <h1>Iterations</h1>
      <button id="sync" class="btn-ghost" title="執行 get_iterations.py 重新同步">↻ 同步</button>
    </header>
    <input id="filter" type="search" placeholder="篩選 Iteration 名稱…" />
    <div id="tree" role="tree"></div>
    <p id="tree-status" class="muted"></p>
  </aside>

  <main id="content">
    <header class="content-head">
      <div>
        <h2 id="wi-title">請從左側選擇 Iteration</h2>
        <p id="wi-sub" class="muted"></p>
      </div>
      <label class="check"><input id="exact" type="checkbox" /> 不含子 Iteration</label>
    </header>
    <div id="wi-status" class="status"></div>
    <div id="wi-summary" class="summary"></div>
    <div class="table-wrap">
      <table id="wi-table" hidden>
        <thead>
          <tr>
            <th>ID</th><th>類型</th><th>標題</th><th>狀態</th><th>指派給</th>
            <th>Iteration</th><th class="num">剩餘</th><th class="num">完成</th><th>最後修改</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
